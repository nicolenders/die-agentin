name: Trigger auto deployment for nicolenders-prod-web

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/nicolenders-prod-web-AutoDeployTrigger-0ca5fd12-ab86-40bd-9dfc-2d907aaae00e.yml'

  # Allow manual trigger 
  workflow_dispatch:      

# Deploys must not overlap: a Container App can only run one provisioning
# operation at a time. Queue runs (do not cancel an in-flight deploy).
concurrency:
  group: deploy-nicolenders-prod-web
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.NICOLENDERSPRODWEB_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.NICOLENDERSPRODWEB_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.NICOLENDERSPRODWEB_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: nicolendersacr.azurecr.io
          registryUsername: ${{ secrets.NICOLENDERSPRODWEB_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.NICOLENDERSPRODWEB_REGISTRY_PASSWORD }}
          containerAppName: nicolenders-prod-web
          resourceGroup: nicolenders-rg
          imageToBuild: nicolendersacr.azurecr.io/nicolenders-prod-web:${{ github.sha }}

      # Configuration as code: applied on every deploy so it can never silently
      # disappear from the app (unlike hand-edited portal env vars). Sensitive
      # values are stored as Container App secrets; DATABASE_URL and other
      # infrastructure-managed variables are preserved (--set-env-vars only
      # touches the keys listed here).
      # SITE_URL und PUBLIC_SITE_HOST kommen aus Repository-Variablen
      # (Settings → Secrets and variables → Actions → Variables), damit der
      # Domain-Umzug eine Konfigurationsänderung bleibt und kein Commit.
      # Ohne gesetzte Variablen greifen die bisherigen Werte.
      #
      # PUBLIC_SITE_HOST ist der kanonische Hostname OHNE Schema und steuert
      # canonical, hreflang, og:image (lib/site.ts) sowie die noindex-
      # Entscheidung in proxy.ts. Leer = Host wird aus NEXT_PUBLIC_SITE_URL
      # abgeleitet. Erst setzen, wenn die Domain auf der Container App
      # gebunden ist — sonst bekommt die einzige erreichbare Adresse ein
      # noindex.
      #
      # SMTP_* speist die Erinnerungsmail an nahende Veröffentlichungsdaten
      # (ADR 0023). Host, Port und Absender stehen als Repository-Variablen,
      # Benutzer und Passwort als Secrets. Ohne SMTP_HOST/SMTP_FROM wird nichts
      # verschickt — die Einstellungen sagen das in der Oberfläche.
      - name: Apply application configuration
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://nicolenders-prod-web.wittybush-b6a6f63e.westeurope.azurecontainerapps.io' }}
          PUBLIC_SITE_HOST: ${{ vars.PUBLIC_SITE_HOST }}
        run: |
          az containerapp secret set \
            --name nicolenders-prod-web \
            --resource-group nicolenders-rg \
            --secrets \
              auth-secret="${{ secrets.AUTH_SECRET }}" \
              entra-client-secret="${{ secrets.ENTRA_CLIENT_SECRET }}" \
              linkedin-client-secret="${{ secrets.LINKEDIN_CLIENT_SECRET }}" \
              smtp-password="${{ secrets.SMTP_PASSWORD }}"

          az containerapp update \
            --name nicolenders-prod-web \
            --resource-group nicolenders-rg \
            --set-env-vars \
              "NEXT_PUBLIC_SITE_URL=$SITE_URL" \
              "PUBLIC_SITE_HOST=$PUBLIC_SITE_HOST" \
              "AUTH_URL=$SITE_URL" \
              "AUTH_SECRET=secretref:auth-secret" \
              "AUTH_MICROSOFT_ENTRA_ID_ID=${{ secrets.ENTRA_CLIENT_ID }}" \
              "AUTH_MICROSOFT_ENTRA_ID_ISSUER=https://login.microsoftonline.com/${{ secrets.ENTRA_TENANT_ID }}/v2.0" \
              "AUTH_MICROSOFT_ENTRA_ID_SECRET=secretref:entra-client-secret" \
              "ADMIN_OBJECT_IDS=${{ secrets.ADMIN_OBJECT_IDS }}" \
              "LINKEDIN_CLIENT_ID=${{ secrets.LINKEDIN_CLIENT_ID }}" \
              "LINKEDIN_CLIENT_SECRET=secretref:linkedin-client-secret" \
              "SMTP_HOST=${{ vars.SMTP_HOST }}" \
              "SMTP_PORT=${{ vars.SMTP_PORT }}" \
              "SMTP_FROM=${{ vars.SMTP_FROM }}" \
              "SMTP_USER=${{ secrets.SMTP_USER }}" \
              "SMTP_PASSWORD=secretref:smtp-password"
