# Rollback auf eine ältere Revision (SPEC §15). Manuell gestartet, kein Neubau:
# die App bekommt die Konfiguration einer bereits vorhandenen Revision zurück.
#
# Warum kein Traffic-Switch mehr: Die Container App läuft im Single-Revision-
# Modus (infra/main.bicep). Im Mehrfach-Modus blieb jede je erzeugte Revision
# aktiv und hielt wegen `minReplicas: 1` dauerhaft ein Replica am Laufen — das
# war der größte Posten auf der Azure-Rechnung. Im Single-Modus ist immer genau
# eine Revision aktiv; `az containerapp revision copy` erzeugt aus der alten
# Revision eine neue und macht sie zur aktiven. Das ist derselbe Vorgang wie ein
# Deployment, nur mit altem Inhalt: kein Build, kein Push, keine Ausfallzeit.
#
# Revisionsnamen anzeigen:
#   az containerapp revision list -n nicolenders-prod-web -g nicolenders-rg \
#     --query "[].{name:name, active:properties.active, created:properties.createdTime}" -o table
# Der Workflow listet sie auch selbst auf, bevor er zurückrollt.

name: Rollback (auf eine ältere Revision)

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Revisionsname, auf den zurückgerollt wird"
        required: true
        type: string

# Ein Deployment und ein Rollback dürfen sich nicht überholen: eine Container
# App verträgt nur eine Provisionierung zur Zeit. Dieselbe Gruppe wie im
# Deploy-Workflow.
concurrency:
  group: deploy-nicolenders-prod-web
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.NICOLENDERSPRODWEB_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.NICOLENDERSPRODWEB_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.NICOLENDERSPRODWEB_AZURE_SUBSCRIPTION_ID }}

      - name: Vorhandene Revisionen zeigen
        run: |
          az containerapp revision list \
            -n nicolenders-prod-web -g nicolenders-rg \
            --query "[].{name:name, active:properties.active, created:properties.createdTime}" \
            -o table

      - name: Gewählte Revision wieder aktivieren
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          # Erst prüfen, ob es die Revision überhaupt gibt — sonst liefe das
          # Rollback ins Leere und die Seite bliebe auf der kaputten Version.
          az containerapp revision show \
            -n nicolenders-prod-web -g nicolenders-rg --revision "$REVISION" -o none
          az containerapp revision copy \
            -n nicolenders-prod-web -g nicolenders-rg \
            --from-revision "$REVISION"
          az containerapp show \
            -n nicolenders-prod-web -g nicolenders-rg \
            --query "properties.latestReadyRevisionName" -o tsv
          echo "Rollback aktiv: neue Revision aus $REVISION erzeugt und aktiv."
