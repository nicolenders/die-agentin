<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"
     width="1024" height="1024" role="img" aria-label="Fadenkreuz mit drei konzentrischen Kreisen">
  <defs>
    <linearGradient id="gOutTop" gradientUnits="userSpaceOnUse"
        x1="688.78" y1="335.22" x2="335.22" y2="335.22">
      <stop offset="0.0" stop-color="#E77BFD"/>
      <stop offset="0.25" stop-color="#CE6BF2"/>
      <stop offset="0.5" stop-color="#DA6FF9"/>
      <stop offset="0.75" stop-color="#9148E0"/>
      <stop offset="1.0" stop-color="#6B3BC4"/>
    </linearGradient>
    <linearGradient id="gOutLeft" gradientUnits="userSpaceOnUse"
        x1="335.22" y1="335.22" x2="335.22" y2="688.78">
      <stop offset="0.0" stop-color="#6B3BC4"/>
      <stop offset="0.25" stop-color="#562AAD"/>
      <stop offset="0.5" stop-color="#5E31BD"/>
      <stop offset="0.75" stop-color="#BF64F6"/>
      <stop offset="1.0" stop-color="#D474FA"/>
    </linearGradient>
    <linearGradient id="gOutBottom" gradientUnits="userSpaceOnUse"
        x1="335.22" y1="688.78" x2="688.78" y2="688.78">
      <stop offset="0.0" stop-color="#D474FA"/>
      <stop offset="0.25" stop-color="#D46EF7"/>
      <stop offset="0.5" stop-color="#7D3DD1"/>
      <stop offset="0.75" stop-color="#4E2496"/>
      <stop offset="1.0" stop-color="#5329AE"/>
    </linearGradient>
    <linearGradient id="gOutRight" gradientUnits="userSpaceOnUse"
        x1="688.78" y1="688.78" x2="688.78" y2="335.22">
      <stop offset="0.0" stop-color="#5329AE"/>
      <stop offset="0.25" stop-color="#6232BC"/>
      <stop offset="0.5" stop-color="#B25CF3"/>
      <stop offset="0.75" stop-color="#D56EFD"/>
      <stop offset="1.0" stop-color="#E77BFD"/>
    </linearGradient>
    <linearGradient id="gLineH" gradientUnits="userSpaceOnUse"
        x1="215" y1="512" x2="809" y2="512">
      <stop offset="0.0" stop-color="#2C145B"/>
      <stop offset="0.167" stop-color="#6233BE"/>
      <stop offset="0.333" stop-color="#6434C0"/>
      <stop offset="0.5" stop-color="#E580F9"/>
      <stop offset="0.667" stop-color="#A456DF"/>
      <stop offset="0.833" stop-color="#B75CF0"/>
      <stop offset="1.0" stop-color="#3C215A"/>
    </linearGradient>
    <linearGradient id="gLineV" gradientUnits="userSpaceOnUse"
        x1="512" y1="215" x2="512" y2="809">
      <stop offset="0.0" stop-color="#7A3EA3"/>
      <stop offset="0.167" stop-color="#C85DF5"/>
      <stop offset="0.333" stop-color="#9C49DC"/>
      <stop offset="0.5" stop-color="#DD7BF8"/>
      <stop offset="0.667" stop-color="#9643DE"/>
      <stop offset="0.833" stop-color="#8239D0"/>
      <stop offset="1.0" stop-color="#27164D"/>
    </linearGradient>
    <linearGradient id="gInner" gradientUnits="userSpaceOnUse"
        x1="477.35" y1="477.35" x2="546.65" y2="546.65">
      <stop offset="0" stop-color="#964DD9"/>
      <stop offset="0.5" stop-color="#C05DF1"/>
      <stop offset="1" stop-color="#B45FF5"/>
    </linearGradient>
    <radialGradient id="gGlow" gradientUnits="userSpaceOnUse"
        cx="512" cy="512" r="34">
      <stop offset="0" stop-color="#F3B8FF" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#D97CFA" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#B45CF0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#9B4BE0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gFadeH" gradientUnits="userSpaceOnUse"
        x1="215" y1="512" x2="809" y2="512">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.06" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.94" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="gFadeV" gradientUnits="userSpaceOnUse"
        x1="512" y1="215" x2="512" y2="809">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.06" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.94" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.55"/>
    </linearGradient>
    <mask id="mFadeH"><rect x="200" y="490" width="624" height="44" fill="url(#gFadeH)"/></mask>
    <mask id="mFadeV"><rect x="490" y="200" width="44" height="624" fill="url(#gFadeV)"/></mask>
  </defs>

  <!-- aeusserer Ring: vier Viertelboegen als Ersatz fuer einen conic gradient -->
  <g fill="none" stroke-width="4.5" stroke-linecap="round">
    <path d="M 688.78 335.22 A 250 250 0 0 0 335.22 335.22" stroke="url(#gOutTop)"/>
    <path d="M 335.22 335.22 A 250 250 0 0 0 335.22 688.78" stroke="url(#gOutLeft)"/>
    <path d="M 335.22 688.78 A 250 250 0 0 0 688.78 688.78" stroke="url(#gOutBottom)"/>
    <path d="M 688.78 688.78 A 250 250 0 0 0 688.78 335.22" stroke="url(#gOutRight)"/>
  </g>

  <!-- mittlerer, duenner Ring -->
  <circle cx="512" cy="512" r="100" fill="none"
          stroke="#50217E" stroke-opacity="0.9" stroke-width="1.6"/>

  <!-- innerer Ring -->
  <circle cx="512" cy="512" r="49" fill="none"
          stroke="url(#gInner)" stroke-width="3.2"/>

  <!-- Fadenkreuz -->
  <line x1="215" y1="512" x2="809" y2="512" stroke="url(#gLineH)"
        stroke-width="3.6" stroke-linecap="round" mask="url(#mFadeH)"/>
  <line x1="512" y1="215" x2="512" y2="809" stroke="url(#gLineV)"
        stroke-width="3.6" stroke-linecap="round" mask="url(#mFadeV)"/>

  <!-- Glow im Zentrum -->
  <circle cx="512" cy="512" r="34" fill="url(#gGlow)"/>
</svg>
