# ---------------------------------------------------------------------------
# Azure DevOps Pipeline für nicolenders.com (SPEC §15).
# Quelle: GitHub · Deployment: Azure DevOps · Auth: Workload Identity Federation.
#
# Einrichtung in wenigen Schritten: siehe infra/README.md.
# Kurz: 1) Variablengruppe "nicolenders" anlegen, 2) Service Connection
# "nicolenders-azure" (Workload Identity Federation) anlegen, 3) Pipeline aus
# dieser Datei erstellen und starten.
#
# Ablauf:
#   validate  – bei jedem PR und auf main: lint · typecheck · test · build
#   deploy    – nur auf main: Image bauen (in der Registry) und alles ausrollen
# ---------------------------------------------------------------------------

trigger:
  branches:
    include: [main]

pr:
  branches:
    include: ['*']

variables:
  # Aus der Variablengruppe (Pipelines → Library). Enthält u. a.
  # sqlAdminPassword, authSecret, jobSharedSecret (als Secret markiert) sowie
  # acrName, resourceGroupName, location, adminObjectIds und optionale Werte.
  - group: nicolenders
  # Name der Azure-Service-Connection (Workload Identity Federation).
  - name: azureServiceConnection
    value: nicolenders-azure
  # Eindeutiger, reproduzierbarer Image-Tag — in jeder Stage identisch.
  - name: imageTag
    value: $(Build.BuildId)
  - name: sqlAdminLogin
    value: nicoleadmin

stages:
  # ---- CI-Gate: läuft bei jedem Pull Request und auf main -------------------
  - stage: validate
    displayName: 'Validate'
    jobs:
      - job: checks
        displayName: 'lint · typecheck · test · build'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
          - script: npm ci
            displayName: 'Install'
          - script: npm run lint
            displayName: 'Lint'
          - script: npm run typecheck
            displayName: 'Typecheck'
          - script: npm run test
            displayName: 'Unit-Tests'
          - script: npm run build
            displayName: 'Build'
          - script: npm audit --audit-level=high
            displayName: 'npm audit (Hinweis, blockt nicht)'
            continueOnError: true

  # ---- CD: nur auf main -----------------------------------------------------
  - stage: deploy
    displayName: 'Deploy nach Azure'
    dependsOn: validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: deploy
        displayName: 'Build-Image · Infra · Migration'
        pool:
          vmImage: 'ubuntu-latest'
        # Das Environment kann in Azure DevOps eine manuelle Freigabe verlangen
        # (Environments → nicolenders-prod → Approvals). Ohne Freigabe läuft es
        # direkt durch.
        environment: 'nicolenders-prod'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: NodeTool@0
                  inputs:
                    versionSpec: '22.x'
                - script: npm ci
                  displayName: 'Install (für Prisma-Migration)'
                - task: AzureCLI@2
                  displayName: 'Registry-Build · Bicep-Deploy · DB-Migration'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      RG="$(resourceGroupName)"
                      LOC="$(location)"
                      ACR="$(acrName)"
                      TAG="$(imageTag)"
                      IMAGE="$ACR.azurecr.io/web:$TAG"

                      echo "== 1/5 Ressourcengruppe & Registry (idempotent) =="
                      az group create -n "$RG" -l "$LOC" -o none
                      az acr create -n "$ACR" -g "$RG" --sku Basic --admin-enabled false -o none

                      echo "== 2/5 Image in der Registry bauen (kein Docker nötig) =="
                      az acr build -r "$ACR" -t "web:$TAG" .

                      echo "== 3/5 Infrastruktur ausrollen (Bicep) =="
                      az deployment group create -g "$RG" -n "deploy-$TAG" \
                        --template-file infra/main.bicep \
                        --parameters \
                          location="$LOC" \
                          acrName="$ACR" \
                          containerImage="$IMAGE" \
                          sqlAdminLogin="$(sqlAdminLogin)" \
                          sqlAdminPassword="$(sqlAdminPassword)" \
                          authSecret="$(authSecret)" \
                          jobSharedSecret="$(jobSharedSecret)" \
                          adminObjectIds="$(adminObjectIds)" \
                          siteUrl="$(siteUrl)" \
                          entraClientId="$(entraClientId)" \
                          entraClientSecret="$(entraClientSecret)" \
                          entraIssuer="$(entraIssuer)" \
                          linkedinClientId="$(linkedinClientId)" \
                          linkedinClientSecret="$(linkedinClientSecret)" \
                          budgetContactEmail="$(budgetContactEmail)" \
                        -o none

                      WEB_URL=$(az deployment group show -g "$RG" -n "deploy-$TAG" --query properties.outputs.webUrl.value -o tsv)
                      SQL_FQDN=$(az deployment group show -g "$RG" -n "deploy-$TAG" --query properties.outputs.sqlServerFqdn.value -o tsv)
                      DB_NAME=$(az deployment group show -g "$RG" -n "deploy-$TAG" --query properties.outputs.databaseName.value -o tsv)
                      SQL_SERVER="${SQL_FQDN%%.*}"

                      echo "== 4/5 Datenbankmigration (Agent-IP temporär freigeben) =="
                      AGENT_IP=$(curl -s https://api.ipify.org)
                      az sql server firewall-rule create -g "$RG" -s "$SQL_SERVER" -n "devops-agent-$TAG" \
                        --start-ip-address "$AGENT_IP" --end-ip-address "$AGENT_IP" -o none
                      export DATABASE_URL="sqlserver://$SQL_FQDN:1433;database=$DB_NAME;user=$(sqlAdminLogin);password=$(sqlAdminPassword);encrypt=true;trustServerCertificate=false"
                      npx prisma migrate deploy
                      az sql server firewall-rule delete -g "$RG" -s "$SQL_SERVER" -n "devops-agent-$TAG" -o none || true

                      echo "== 5/5 Fertig =="
                      echo "Website: $WEB_URL"
                      echo "Falls die Variable siteUrl noch leer ist: einmalig in der"
                      echo "Variablengruppe auf $WEB_URL setzen (für Feeds/OAuth)."
