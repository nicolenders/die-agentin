# Docker-Build → ACR mit Git-SHA als Tag (SPEC §15).
parameters:
  - name: azureServiceConnection
    type: string
  - name: acrName
    type: string
  - name: imageRepository
    type: string

jobs:
  - job: build
    displayName: 'Build & Push'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - task: AzureCLI@2
        inputs:
          azureSubscription: ${{ parameters.azureServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            az acr login --name ${{ parameters.acrName }}
            IMAGE=${{ parameters.acrName }}.azurecr.io/${{ parameters.imageRepository }}:$(Build.SourceVersion)
            docker build -t "$IMAGE" .
            docker push "$IMAGE"
            echo "##vso[task.setvariable variable=image;isOutput=true]$IMAGE"
        name: buildImage
